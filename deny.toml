# cargo-deny policy for freedom-ipfs: vulnerabilities, unsound and
# unmaintained crates, licenses, bans and sources. `cargo deny --locked
# check` passes; every advisory ignored below says why it doesn't apply here,
# and when the ignore can go.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15, a proc macro, through netlink-packet-core (if-watch, for
    # libp2p's QUIC and TCP listeners): unmaintained, with no maintained
    # release to move to. It runs at compile time only, and nothing of it
    # ships.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, compile time only; no upgrade exists" },
]

[licenses]
confidence-threshold = 0.9
# An allowed license no crate here uses fails the check, so the list stays
# what the graph needs.
unused-allowed-license = "deny"
# webpki-roots (Mozilla's root certificates, through reqwest and
# libp2p-websocket): data under the Community Data License Agreement,
# permissive. Scoped to that crate, so another CDLA dependency needs its own
# review.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# A wildcard version (`"*"`) fails, from any registry. The workspace's own
# crates depend on each other by path with no version, which is allowed for
# unpublished crates: every member is `publish = false`
# (`[workspace.package]`), as nothing publishes them.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
