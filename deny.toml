# cargo-deny policy for freedom-ipfs: vulnerabilities, unsound and
# unmaintained crates, licenses, bans and sources. `cargo deny --locked
# check` passes; every advisory ignored below says why it doesn't apply here,
# and when the ignore can go.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # hickory-proto 0.25.2, through libp2p-dns 0.44 (libp2p's `/dns`
    # transport) and freedom-ipfs-net's resolver (`direct`'s DNS
    # configuration, design 0007's gate). The unbounded loop is in DNSSEC's
    # NSEC3 validation, which needs hickory's `dnssec-ring` or
    # `dnssec-aws-lc-rs` feature: this graph builds hickory-proto without
    # either. No 0.25 release fixes it; hickory 0.26 needs a libp2p-dns
    # release that takes it.
    { id = "RUSTSEC-2026-0118", reason = "DNSSEC validation only; hickory-proto is built without its dnssec features" },
    # The same crate and paths. The quadratic name compression is in message
    # encoding: these stub resolvers encode only their own one-question
    # queries, and decode the answers. The fix is hickory-proto 0.26.1, as
    # above.
    { id = "RUSTSEC-2026-0119", reason = "encoding only: the resolvers encode their own queries, never a received message" },
    # paste 1.0.15, a proc macro, through netlink-packet-core (if-watch, for
    # libp2p's QUIC and TCP listeners): unmaintained, with no maintained
    # release to move to. It runs at compile time only, and nothing of it
    # ships.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, compile time only; no upgrade exists" },
]

[licenses]
confidence-threshold = 0.9
# An allowed license no crate here uses fails the check, so the list stays
# what the graph needs.
unused-allowed-license = "deny"
# webpki-roots (Mozilla's root certificates, through reqwest and
# libp2p-websocket): data under the Community Data License Agreement,
# permissive. Scoped to that crate, so another CDLA dependency needs its own
# review.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# A wildcard version (`"*"`) fails, from any registry. The workspace's own
# crates depend on each other by path with no version, which is allowed for
# unpublished crates: every member is `publish = false`
# (`[workspace.package]`), as nothing publishes them.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
