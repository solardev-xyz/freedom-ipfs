[workspace]
members = [
    "crates/freedom-ipfs-core",
    "crates/freedom-ipfs-store",
    "crates/freedom-ipfs-unixfs",
    "crates/freedom-ipfs-namesys",
    "crates/freedom-ipfs-routing",
    "crates/freedom-ipfs-retrieval",
    "crates/freedom-ipfs-gateway",
    "crates/freedom-ipfs-mobile",
    "crates/freedom-ipfs-net",
    "crates/freedom-ipfs-addr",
    "crates/freedom-ipfs-socks",
    "tools/mobile-web-harness",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.4.6"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solardev-xyz/freedom-ipfs"
homepage = "https://github.com/solardev-xyz/freedom-ipfs"
authors = ["Freedom IPFS contributors"]
# Nothing publishes these crates: their users take them by git or by path.
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
cid = { version = "0.11", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
futures = "0.3"
http = "1"
# Without libp2p's `dns`: its DNS layer, libp2p-dns 0.44, resolves with
# hickory 0.25 (RUSTSEC-2026-0491), so freedom-ipfs-net has the layer itself
# (its `transport::dns`, over hickory 0.26). Without `websocket` either: the
# `SwarmBuilder`'s WebSocket phase needs `dns`, and nothing here uses it;
# the WebSocket transport is libp2p-websocket's own, below.
libp2p = { version = "0.56", default-features = false, features = ["ed25519", "identify", "kad", "macros", "noise", "ping", "quic", "rsa", "tcp", "tls", "tokio", "yamux"] }
# libp2p 0.56's WebSocket transport, which its `websocket` feature
# re-exports.
libp2p-websocket = "0.45.1"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand", "rsa"] }
libp2p-stream = "0.4.0-alpha"
mime_guess = "2"
# The decoding axum's `Path` extractor uses, for native requests' paths.
percent-encoding = "2"
multiaddr = { version = "0.18", default-features = false }
multibase = "0.9"
multihash = "0.19"
multihash-codetable = { version = "0.2", features = ["sha2"] }
parking_lot = "0.12"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = "0.6"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "json"] }
unsigned-varint = "0.8"
url = "2"

freedom-ipfs-core = { path = "crates/freedom-ipfs-core" }
freedom-ipfs-store = { path = "crates/freedom-ipfs-store" }
freedom-ipfs-unixfs = { path = "crates/freedom-ipfs-unixfs" }
freedom-ipfs-namesys = { path = "crates/freedom-ipfs-namesys" }
freedom-ipfs-routing = { path = "crates/freedom-ipfs-routing" }
freedom-ipfs-retrieval = { path = "crates/freedom-ipfs-retrieval" }
freedom-ipfs-gateway = { path = "crates/freedom-ipfs-gateway" }
freedom-ipfs-mobile = { path = "crates/freedom-ipfs-mobile" }
freedom-ipfs-net = { path = "crates/freedom-ipfs-net" }
freedom-ipfs-addr = { path = "crates/freedom-ipfs-addr" }
freedom-ipfs-socks = { path = "crates/freedom-ipfs-socks" }
