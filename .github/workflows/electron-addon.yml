name: Electron Addon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/electron-addon.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bindings/node/**"
      - "crates/**"
      - "ffi/**"
      - "rust-toolchain.toml"
      - "scripts/package-electron-addon.js"
  pull_request:
    paths:
      - ".github/workflows/electron-addon.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bindings/node/**"
      - "crates/**"
      - "ffi/**"
      - "rust-toolchain.toml"
      - "scripts/package-electron-addon.js"
  workflow_dispatch:

jobs:
  build:
    name: Build Electron addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/freedom-ipfs-node/package-lock.json

      - name: Show toolchains
        run: |
          rustup show
          cargo --version
          rustc --version
          node --version
          npm --version

      - name: Install addon dependencies
        working-directory: bindings/node/freedom-ipfs-node
        run: npm ci

      - name: Build packaged addon
        run: node scripts/package-electron-addon.js

      - name: Smoke packaged addon
        working-directory: bindings/node/freedom-ipfs-node
        run: npm run smoke

      # The default allocators rarely give a freed node's address to the next
      # node, so the smoke's address-reuse check needs jemalloc with a single
      # arena and no thread cache to actually take that path.
      - name: Smoke node address reuse (jemalloc)
        if: runner.os == 'Linux'
        working-directory: bindings/node/freedom-ipfs-node
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc2
          jemalloc="$(dpkg -L libjemalloc2 | grep '/libjemalloc\.so\.2$' | head -n1)"
          test -n "$jemalloc"
          MALLOC_CONF=narenas:1,tcache:false LD_PRELOAD="$jemalloc" \
            FREEDOM_IPFS_SMOKE_MIN_REUSED_ADDRESSES=1 npm run smoke

      - name: Upload addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: freedom-ipfs-node-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/electron-addon/freedom-ipfs-node-electron41-*.tar.gz
            target/electron-addon/freedom-ipfs-node-electron41-*.tar.gz.sha256
          if-no-files-found: error
