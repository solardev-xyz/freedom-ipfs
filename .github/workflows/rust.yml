name: Rust

# The workspace's tests on every pull request, and clippy on
# `freedom-ipfs-net`, the network policy's crate (freedom-core design 0007,
# upstream item 3), and `freedom-ipfs-addr`, its gate's pure half. The other
# crates aren't linted here.

# The paths are the Rust tree plus the two files the tests read with
# `include_str!`: the add-on's packaging script and the iOS evidence template.
on:
  push:
    branches: [main, integration/rust-core]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/ios-device-evidence-template.csv"
      - "ffi/**"
      - "rust-toolchain.toml"
      - "scripts/package-electron-addon.js"
      - "tests/**"
      - "tools/**"
      - "xtask/**"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/ios-device-evidence-template.csv"
      - "ffi/**"
      - "rust-toolchain.toml"
      - "scripts/package-electron-addon.js"
      - "tests/**"
      - "tools/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Backtraces keep their files and lines, and the cached target directory
  # stays a fraction of full debug info's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `--all-features` takes in freedom-ipfs-net's `socks` and `test-util`
      # features, which the network policy's SOCKS tests need. The live,
      # Kubo and soak tests are `#[ignore]`d and stay off.
      # The network policy's kernel-level tests run again in a private
      # network namespace (crates/freedom-ipfs-gateway/tests/policy_support),
      # whose counters see every socket however short-lived. Ubuntu's
      # runners refuse unprivileged user namespaces through AppArmor unless
      # this is off, and FREEDOM_IPFS_REQUIRE_PRIVATE_NET makes a test that
      # can't enter one fail rather than run in place. Each private run
      # prints "checked in a private network" to the log.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net sh -c 'ip link set lo up && ip route add local 0.0.0.0/0 dev lo && ip -6 route add local ::/0 dev lo && echo "a private network works here"'

      - name: Test the workspace
        env:
          FREEDOM_IPFS_REQUIRE_PRIVATE_NET: "1"
        run: cargo test --workspace --all-features --locked

  clippy:
    name: cargo clippy (freedom-ipfs-net, freedom-ipfs-addr)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain and add clippy
        run: |
          rustup show
          rustup component add clippy
          cargo clippy --version

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      # With every feature, and the library without any, as mobile builds it.
      - name: Lint freedom-ipfs-net
        run: |
          cargo clippy -p freedom-ipfs-net --all-targets --all-features --locked -- -D warnings
          cargo clippy -p freedom-ipfs-net --lib --no-default-features --locked -- -D warnings
      - name: Lint freedom-ipfs-addr
        run: |
          cargo clippy -p freedom-ipfs-addr --all-targets --all-features --locked -- -D warnings
          cargo clippy -p freedom-ipfs-addr --lib --no-default-features --locked -- -D warnings
