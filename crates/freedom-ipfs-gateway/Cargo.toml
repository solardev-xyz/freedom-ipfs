[package]
name = "freedom-ipfs-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
cid.workspace = true
clap.workspace = true
freedom-ipfs-core.workspace = true
freedom-ipfs-namesys.workspace = true
freedom-ipfs-net.workspace = true
freedom-ipfs-retrieval.workspace = true
freedom-ipfs-routing.workspace = true
freedom-ipfs-store.workspace = true
freedom-ipfs-unixfs.workspace = true
futures.workspace = true
http.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `socks5` mode (design 0007): the network crate's SOCKS5 client and libp2p
# transport. Off by default (D2).
socks = ["freedom-ipfs-net/socks"]

[dev-dependencies]
# The SOCKS5 test proxy and `socks5` networks, for the network policy's
# end-to-end tests.
freedom-ipfs-net = { workspace = true, features = ["test-util"] }
prost.workspace = true
reqwest.workspace = true
tempfile.workspace = true
# `oneshot`, to send the router a path exactly as written.
tower = { version = "0.5", features = ["util"] }
